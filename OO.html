<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0_0</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.min.js"></script>
  </head>
  <body>
    <script>
      let codeText = [
        "function setup() {",
        "  createCanvas(windowWidth, windowHeight);",
        "  textSize(60);",
        "}",
        "",
        "function draw() {",
        "  background(200, 200, 30, 16);",
        '  text("0_0", mouseX, mouseY);',
        "  line(width/2, height/2, mouseX, mouseY);",
        "}",
      ];

      function setup() {
        createCanvas(windowWidth, windowHeight);
        textSize(60);
      }

      function draw() {
        background(200, 200, 30, 16);

        fill(0);
        stroke(0);
        textSize(60);
        text("0_0", mouseX, mouseY);
        line(width / 2, height / 2, mouseX, mouseY);

        drawCodeText();
      }

      function drawCodeText() {
        let codeX = width * 0.58;
        let codeY = 60;

        noStroke();
        fill(0);
        textAlign(LEFT, TOP);
        textSize(15);
        textFont("monospace");

        for (let i = 0; i < codeText.length; i++) {
          text(codeText[i], codeX, codeY + i * 22);
        }
      }

    </script>
  </body>
</html>
