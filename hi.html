<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hi</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.min.js"></script>
  </head>
  <body>
    <script>
      let codeText = [
        "function setup() {",
        "  createCanvas(windowWidth, windowHeight);",
        '  background("pink");',
        "  rectMode(CENTER);",
        "}",
        "",
        "function draw() {",
        "  background(200, 200, 30, 16);",
        "  circle(mouseY, mouseX, 120);",
        '  text("Hi", mouseX, mouseY);',
        "}",
      ];

      function setup() {
        createCanvas(windowWidth, windowHeight);
        background("pink");
        rectMode(CENTER);
      }

      function draw() {
        background(200, 200, 30, 16);

        fill(255, 180, 220);
        stroke(0);
        circle(mouseY, mouseX, 120);

        fill(0);
        noStroke();
        textSize(24);
        textAlign(CENTER, CENTER);
        text("Hi", mouseX, mouseY);

        drawCodeText();
      }

      function drawCodeText() {
        let codeX = width * 0.58;
        let codeY = 60;

        fill(0);
        noStroke();
        textAlign(LEFT, TOP);
        textSize(15);
        textFont("monospace");

        for (let i = 0; i < codeText.length; i++) {
          text(codeText[i], codeX, codeY + i * 22);
        }
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }
    </script>
  </body>
</html>
